name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Bağımlılıklar
        run: |
          flutter pub get
          dart pub get -C packages/game_core
          dart pub get -C packages/game_ai

      - name: Analiz
        run: |
          dart analyze
          dart analyze packages/game_core
          dart analyze packages/game_ai

      - name: Test — game_core
        working-directory: packages/game_core
        run: dart test

      - name: Test — game_ai
        working-directory: packages/game_ai
        run: dart test

      - name: Test — uygulama
        # tool etiketli dosyalar varlık üretecidir (test/tool/), CI'da atlanır.
        run: flutter test --exclude-tags tool

  # Android derlemesi her push/PR'da — platform (Gradle + eklentiler + AOT) kırılmasını yakalar.
  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Keystore yok → debug imzaya düşülür (android/app/build.gradle.kts).
      # Release yolu (tree-shake + AOT) yine de derlenir.
      - name: flutter build apk --release
        run: flutter build apk --release

  # iOS derlemesi yalnız main'e push + elle tetik (macOS runner 10x dakika çarpanı).
  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter build ios --release --no-codesign
        run: flutter build ios --release --no-codesign
