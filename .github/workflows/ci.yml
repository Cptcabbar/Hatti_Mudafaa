name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Bağımlılıklar
        run: |
          flutter pub get
          dart pub get -C packages/game_core
          dart pub get -C packages/game_ai

      - name: Analiz
        run: |
          dart analyze
          dart analyze packages/game_core
          dart analyze packages/game_ai

      - name: Test — game_core
        working-directory: packages/game_core
        run: dart test

      - name: Test — game_ai
        working-directory: packages/game_ai
        run: dart test

      - name: Test — uygulama
        # tool etiketli dosyalar varlık üretecidir (test/tool/), CI'da atlanır.
        run: flutter test --exclude-tags tool

  # Android — her push'ta (ubuntu ucuz/hızlı): platform kırılmasını yakalar +
  # her zaman güncel bir APK/AAB "Artifacts"ta hazır bekler.
  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # key.properties yok → app/debug.keystore ile imzalanır (sabit test
      # imzası). Release yolu (tree-shake + AOT) tam derlenir.
      - name: APK (yan yükleme / test)
        run: flutter build apk --release

      - name: AAB (Play Store)
        run: flutter build appbundle --release

      - name: Paketleri yükle
        uses: actions/upload-artifact@v4
        with:
          name: hatti-mudafaa-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

  # iOS — YALNIZCA elle tetik (Actions → CI → "Run workflow"). macOS runner'ı
  # 10x dakika yediği için gereksiz yere çalışmaz. İmzasız IPA üretir:
  # gerçek cihaza kurmak için Sideloadly / AltStore (Apple ID ile yeniden
  # imzalar) ya da Mac + Apple Developer hesabı gerekir (bkz. docs/platform-build.md).
  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter build ios --release --no-codesign
        run: flutter build ios --release --no-codesign

      - name: İmzasız IPA paketle
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry hatti-mudafaa-unsigned.ipa Payload
          ls -lh hatti-mudafaa-unsigned.ipa

      - name: IPA'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: hatti-mudafaa-ios-unsigned
          path: build/ios/iphoneos/hatti-mudafaa-unsigned.ipa
          if-no-files-found: error
          retention-days: 90
