include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_const_constructors
    - unnecessary_lambdas
    - avoid_redundant_argument_values
    - directives_ordering
